<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">


<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-5">


<div class="card shadow">

<div class="card-body">


<h2 class="text-center mb-4">
    Create Account
</h2>


<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label class="form-label">
Username
</label>

<input type="text"
name="username"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">
Password
</label>

<input type="password"
name="password"
class="form-control"
required>

</div>



<button class="btn btn-success w-100">
Register
</button>


</form>


<p class="text-center mt-3">

Already have an account?

<a href="/users/login/">
Login
</a>

</p>


</div>

</div>


</div>

</div>

</div>


</body>
</html>
